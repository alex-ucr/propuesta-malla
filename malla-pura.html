<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Propuesta de malla curricular</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --text: #1a1d21;
      --muted: #5c6370;
      --border: #d8dee6;
      --accent: #1e4d7b;
      --accent-soft: #e8f0f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .page {
      max-width: 52rem;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0 0 0.5rem;
      font-size: 1.55rem;
      font-weight: 650;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    header .subtitle {
      margin: 0.2rem 0;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 500;
    }
    header .malla-fig {
      margin: 1.1rem 0 0;
    }
    header .malla-fig-inner {
      position: relative;
      display: block;
      max-width: 100%;
      margin: 0 auto;
      line-height: 0;
    }
    header .malla-fig img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 4px;
    }
    /* Áreas clicable: % respecto a la imagen; ajuste left/top/width/height a cada recuadro (MA0151, MA0251, …) */
    header .malla-hotspot {
      position: absolute;
      display: block;
      text-indent: -9999px;
      overflow: hidden;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    header .malla-hotspot:hover {
      background: rgba(30, 77, 123, 0.12);
      box-shadow: inset 0 0 0 2px rgba(30, 77, 123, 0.35);
    }
    header .malla-hotspot:focus {
      outline: none;
    }
    header .malla-hotspot:focus-visible {
      background: rgba(30, 77, 123, 0.16);
      box-shadow: inset 0 0 0 3px rgba(30, 77, 123, 0.45);
    }
    .cycle {
      margin-bottom: 1.75rem;
    }
    .cycle h2 {
      font-size: 1.1rem;
      margin: 0 0 0.65rem;
      color: var(--accent);
      font-weight: 650;
    }
    details.course {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }
    details.course summary {
      list-style: none;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    details.course summary::-webkit-details-marker { display: none; }
    details.course summary::before {
      content: "▶";
      font-size: 0.65rem;
      opacity: 0.6;
      transition: transform 0.15s ease;
    }
    details.course[open] summary::before {
      transform: rotate(90deg);
    }
    details.course summary:hover {
      filter: brightness(0.98);
    }
    .contenidos {
      margin: 0;
      padding: 1rem 1.1rem 1.1rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
      background: #fafbfc;
      border-top: 1px solid var(--border);
      max-height: min(70vh, 36rem);
      overflow: auto;
    }
    .contenidos .contenidos-bloque ol { margin: 0.4rem 0 0.4rem 1.25rem; }
    .contenidos .contenidos-bloque ol ol { list-style: lower-alpha; }
    .contenidos .contenidos-bloque ul { margin: 0.35rem 0 0.35rem 1.1rem; }
    .contenidos .math { font-family: "Cambria Math", "STIX Two Math", serif; }
    .contenidos .cite { color: #555; }
    .contenidos .pdf-link {
      margin: 0 0 0.9rem;
      font-size: 0.9rem;
    }
    .contenidos .pdf-link a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .contenidos .pdf-link a:hover {
      text-decoration: underline;
    }
    .contenidos .falta-contenidos {
      color: #a63;
      font-style: italic;
    }
    .load-error {
      background: #fff3e0;
      border: 1px solid #e0a040;
      color: #5d3a0a;
      padding: 1rem 1.1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .load-error code { font-size: 0.88em; }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Propuesta de malla curricular</h1>
      <p class="subtitle">Carrera de matemática</p>
      <p class="subtitle">Énfasis en matemática pura</p>
      <figure class="malla-fig">
        <div class="malla-fig-inner" id="malla-fig-wrap">
          <img
            src="propuesta_pura.png"
            alt="Diagrama de la propuesta de malla curricular (énfasis en matemática pura)"
          />
          <!--
            Clic: abre el colapsable. Las zonas se generan con crearHotspotsSobreMalla (script).
            Ajuste HOTSPOT_POR_TITULO en malla-pura.html para alinear con cada caja de la imagen.
          -->
        </div>
      </figure>
    </header>
    <div id="err" class="load-error" hidden>
      No se pudieron cargar <code>pura.json</code> o <code>contenidos_por_curso.json</code>
      (los navegadores suelen bloquear <code>file://</code>).
      En esta carpeta ejecute, por ejemplo:
      <br /><code>python -m http.server 8080</code>
      y abra <code>http://localhost:8080/malla-pura.html</code>
    </div>
    <main id="malla" aria-live="polite"></main>
  </div>
  <script>
    (function () {
      const main = document.getElementById("malla");
      const errBox = document.getElementById("err");

      /** Mismo directorio que esta página: PDF generados con latexmk a partir de Cursos/ */
      const PDF_POR_TITULO = {
        "MA-0151 Fundamentos de álgebra, trigonometría y geometría analítica":
          "https://www.overleaf.com/project/69dd3ad24aede6daa14b1b87#MA0151",
        "MA-0152 Matemática Exploratoria": "MA0152-matematica-exploratoria.pdf",
        "MA-0251 Introducción al Cálculo en una variable":
          "MA0251-calculo-una-variable.pdf",
        "MA-0252 Introducción a las Demostraciones":
          "MA0252-intro-demostraciones.pdf",
        "MA-0361 Algebra Lineal I": "MA0361-algebra-lineal-i.pdf",
        "MA-0341 Matemática Computacional I": "MA0341-matematica-computacional-i.pdf",
        "MA-0351 Introducción al Cálculo en varias variables":
          "MA0351-calculo-varias-variables.pdf",
        "MA-0461 Algebra Lineal II": "MA0461-algebra-lineal-ii.pdf",
        "MA-0641 Matemática Computacional II":
          "MA0641-matematica-computacional-ii.pdf",
        "MA-0451 Principios de análisis en una variable":
          "MA0451-principios-analisis-i.pdf",
        "MA-0461 Teoría de Números": "MA0461-teoria-numeros.pdf",
        "MA-0472 Introducción a la Geometría Diferencial": "MA0472-geometria.pdf",
        "MA-0561 Algebra Abstracta I": "MA0561-algebra-abstracta-i.pdf",
        "MA-0551 Principios de análisis en varias variables":
          "MA0551-principios-analisis-ii.pdf",
        "MA-0615 Ecuaciones Diferenciales": "MA-0615-ecuaciones-diferenciales.pdf",
        "MA-0705 Análisis Real I": "MA-0705-analisis-real-i.pdf",
        "MA-0661 Algebra Abstracta II": "MA0661-algebra-abstracta-ii.pdf",
        "MA-0702 Análisis Complejo": "MA-0702-analisis-complejo.pdf",
        "MA-0635 Introducción a la Topología": "MA0635-topologia.pdf",
        "MA-0725 Análisis Real II": "MA-0725-analisis-real-ii.pdf",
      };

      const ORDEN_CICLOS = [
        "I Ciclo", "II Ciclo", "III Ciclo", "IV Ciclo",
        "V Ciclo", "VI Ciclo", "VII Ciclo", "Optativas"
      ];

      /** Un id por título (debe coincidir con cadenas de pura.json) — anclas #curso-... */
      const ID_POR_TITULO = {
        "MA-0151 Fundamentos de álgebra, trigonometría y geometría analítica":
          "curso-fundamentos-algebra",
        "MA-0152 Matemática Exploratoria": "curso-matematica-exploratoria",
        "MA-0251 Introducción al Cálculo en una variable":
          "curso-calculo-una-variable",
        "MA-0252 Introducción a las Demostraciones": "curso-intro-demostraciones",
        "MA-0361 Algebra Lineal I": "curso-algebra-lineal-i",
        "MA-0341 Matemática Computacional I": "curso-mat-computacional-i",
        "MA-0351 Introducción al Cálculo en varias variables":
          "curso-calculo-varias-variables",
        "MA-0461 Algebra Lineal II": "curso-algebra-lineal-ii",
        "MA-0641 Matemática Computacional II": "curso-mat-computacional-ii",
        "MA-0451 Principios de análisis en una variable":
          "curso-principios-analisis-una-variable",
        "MA-0496 Teoría de Números": "curso-teoria-numeros",
        "MA-0471 Introducción a la Geometría Diferencial":
          "curso-geometria-diferencial",
        "MA-0561 Algebra Abstracta I": "curso-algebra-abstracta-i",
        "MA-0551 Principios de análisis en varias variables":
          "curso-principios-analisis-varias-variables",
        "MA-0515 Ecuaciones Diferenciales": "curso-ecuaciones-diferenciales",
        "MA-0705 Análisis Real I": "curso-analisis-real-i",
        "MA-0661 Algebra Abstracta II": "curso-algebra-abstracta-ii",
        "MA-0702 Análisis Complejo": "curso-analisis-complejo",
        "MA-0635 Introducción a la Topología": "curso-topologia",
        "MA-0725 Análisis Real II": "curso-analisis-real-ii",
      };

      /**
       * % respecto a la imagen: left, top, w, h. Reajuste caja por caja en propuesta_pura.png.
       * (Fundamentos y Cálculo I en una variable conservan posiciones que ya afinó.)
       */
      const HOTSPOT_POR_TITULO = {
        "MA-0151 Fundamentos de álgebra, trigonometría y geometría analítica": {
          left: 49, top: 11.5, w: 14.5, h: 8,
        },
        "MA-0152 Matemática Exploratoria": { left: 32, top: 11.5, w: 14.5, h: 8 },
        "MA-0251 Introducción al Cálculo en una variable": {
          left: 49, top: 22.5, w: 14.5, h: 8,
        },
        "MA-0252 Introducción a las Demostraciones": {
          left: 32, top: 22.5, w: 14.5, h: 8,
        },
        "MA-0361 Algebra Lineal I": { left: 66.5, top: 34, w: 14.5, h: 8 },
        "MA-0341 Matemática Computacional I": { left: 32, top: 34, w: 14.5, h: 8 },
        "MA-0351 Introducción al Cálculo en varias variables": {
          left: 49, top: 34, w: 14.5, h: 8,
        },
        "MA-0361 Algebra Lineal II": { left: 66.5, top: 45, w: 14.5, h: 8 },
        "MA-0641 Matemática Computacional II": { left: 32, top: 68.5, w: 14.5, h: 8 },
        "MA-0451 Principios de análisis en una variable": {
          left: 49, top: 45, w: 14.5, h: 8,
        },
        "MA-0496 Teoría de Números": { left: 32, top: 45, w: 14.5, h: 8 },
        "MA-0471 Introducción a la Geometría Diferencial": { left: 85, top: 45, w: 14.5, h: 8 },
        "MA-0561 Algebra Abstracta I": { left: 66.5, top: 57, w: 14.5, h: 8 },
        "MA-0551 Principios de análisis en varias variables": {
          left: 49, top: 57, w: 14.5, h: 8,
        },
        "MA-0515 Ecuaciones Diferenciales": { left: 32, top: 57, w: 14.5, h: 8 },
        "MA-0705 Análisis Real I": { left: 66.5, top: 82, w: 14.5, h: 8 },
        "MA-0661 Algebra Abstracta II": { left: 66.5, top: 68.5, w: 14.5, h: 8 },
        "MA-0702 Análisis Complejo": { left: 49, top: 82, w: 14.5, h: 8 },
        "MA-0635 Introducción a la Topología": { left: 49, top: 68.5, w: 14.5, h: 8 },
        "MA-0725 Análisis Real II": { left: 32, top: 82, w: 14.5, h: 8 },
      };

      function aplanarCursos(pura) {
        const out = [];
        for (const c of ORDEN_CICLOS) {
          if (!pura[c] || !Array.isArray(pura[c])) continue;
          for (const t of pura[c]) out.push(t);
        }
        return out;
      }

      function crearHotspotsSobreMalla(pura) {
        const wrap = document.getElementById("malla-fig-wrap");
        if (!wrap) return;
        for (const a of wrap.querySelectorAll("a.malla-hotspot")) {
          a.remove();
        }
        for (const title of aplanarCursos(pura)) {
          const id = ID_POR_TITULO[title];
          const g = HOTSPOT_POR_TITULO[title];
          if (!id || !g) continue;
          const el = document.createElement("a");
          el.className = "malla-hotspot";
          el.href = "#" + id;
          el.setAttribute("data-open-curso", id);
          el.title = "Ir a: " + title;
          el.setAttribute("aria-label", "Abrir en la lista: " + title);
          el.textContent = "Enlace: " + title;
          el.style.left = g.left + "%";
          el.style.top = g.top + "%";
          el.style.width = g.w + "%";
          el.style.height = g.h + "%";
          wrap.appendChild(el);
        }
      }

      function openCajaCursoById(detailId) {
        const det = document.getElementById(detailId);
        if (!det) return;
        det.open = true;
        det.scrollIntoView({ behavior: "smooth", block: "center" });
        const s = det.querySelector("summary");
        if (s) s.focus({ preventScroll: true });
      }

      function build(pura, contenidos) {
        const frag = document.createDocumentFragment();
        for (const label of ORDEN_CICLOS) {
          if (!Object.prototype.hasOwnProperty.call(pura, label)) continue;
          const courses = pura[label];
          if (!Array.isArray(courses) || !courses.length) continue;
          const section = document.createElement("section");
          section.className = "cycle";
          const h2 = document.createElement("h2");
          h2.textContent = label;
          section.appendChild(h2);
          for (const title of courses) {
            const det = document.createElement("details");
            det.className = "course";
            const cajaId = ID_POR_TITULO[title];
            if (cajaId) det.id = cajaId;
            const sum = document.createElement("summary");
            sum.textContent = title;
            det.appendChild(sum);
            const block = document.createElement("div");
            block.className = "contenidos";
            const pdfName = PDF_POR_TITULO[title];
            if (pdfName) {
              const wrap = document.createElement("p");
              wrap.className = "pdf-link";
              const a = document.createElement("a");
              a.href = pdfName;
              a.textContent = "Programa (PDF)";
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              wrap.appendChild(a);
              block.appendChild(wrap);
            }
            const html = contenidos[title];
            if (html == null || html === "") {
              const p = document.createElement("p");
              p.className = "falta-contenidos";
              p.appendChild(
                document.createTextNode(
                  "(No hay texto de contenidos en contenidos_por_curso.json para este curso.)"
                )
              );
              block.appendChild(p);
            } else {
              const inner = document.createElement("div");
              inner.innerHTML = html;
              block.appendChild(inner);
            }
            det.appendChild(block);
            section.appendChild(det);
          }
          frag.appendChild(section);
        }
        main.appendChild(frag);
      }

      Promise.all([
        fetch("pura.json").then((r) => {
          if (!r.ok) throw new Error("pura.json");
          return r.json();
        }),
        fetch("contenidos_por_curso.json").then((r) => {
          if (!r.ok) throw new Error("contenidos_por_curso.json");
          return r.json();
        }),
      ])
        .then(([pura, contenidos]) => {
          build(pura, contenidos);
          crearHotspotsSobreMalla(pura);
          document.querySelectorAll("a.malla-hotspot[data-open-curso]").forEach(
            function (a) {
              a.addEventListener("click", function (e) {
                e.preventDefault();
                const id = a.getAttribute("data-open-curso");
                if (id) openCajaCursoById(id);
              });
            }
          );
          if (location.hash) {
            const id = location.hash.slice(1);
            const el = document.getElementById(id);
            if (el && el.tagName === "DETAILS") openCajaCursoById(id);
          }
        })
        .catch(() => {
          errBox.hidden = false;
        });
    })();
  </script>
</body>
</html>
